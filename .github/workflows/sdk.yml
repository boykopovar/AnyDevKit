name: sdk

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sdk-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    uses: ./.github/workflows/sdk-build.yml
  examples:
    needs: build
    uses: ./.github/workflows/sdk-examples.yml
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, examples]
    permissions:
      contents: write
    uses: ./.github/workflows/sdk-release.yml
